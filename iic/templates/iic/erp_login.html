<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IIC ERP Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 30px;
            color: #172554;
        }

        .logo p {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9e2;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #172554;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e3a8a;
        }

        .register {
            text-align: center;
            margin-top: 22px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>IIC ERP</h1>
        <p>Innovation & Incubation Centre</p>
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Registration Number</label>

        <input
            type="text"
            name="register_number"
            placeholder="Example: IIC20260001"
            required
        >

        <label>Date of Birth</label>

        <input
            type="date"
            name="date_of_birth"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    <div class="register">
        New Student?
        <a href="{% url 'student_register' %}">
            Register Here
        </a>
    </div>

</div>

</body>
</html>
